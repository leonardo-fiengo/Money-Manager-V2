{% extends "base.html" %}
{% block content %}
<h1>{{ "Edit" if rule else "Add" }} Recurring Rule</h1>
{% if error %}<p class="form-error">{{ error }}</p>{% endif %}
<form class="form" method="post">
    <label>Name <input name="name" value="{{ rule.name if rule else '' }}" required></label>
    <label>Type
        <span class="select-with-visual">
            <span class="select-leading" aria-hidden="true"></span>
            <select name="type" data-visual-select required>
            {% for type in ["expense", "income", "investment"] %}
            <option value="{{ type }}" data-label="{{ type }}" data-kind="type" data-symbol="{% if type == 'income' %}&uarr;{% elif type == 'expense' %}&darr;{% else %}&nearr;{% endif %}" data-tone="{{ type }}" {% if rule and rule.type == type %}selected{% endif %}>{{ type }}</option>
            {% endfor %}
            </select>
        </span>
    </label>
    <label>Amount <input type="number" step="0.01" min="0" name="amount" value="{{ rule.amount if rule else '' }}" placeholder="0.00" required></label>
    <label>Account
        <span class="select-with-visual">
            <span class="select-leading" aria-hidden="true"></span>
            <select name="account_id" data-visual-select required>
                {% for account in accounts %}
                <option value="{{ account.id }}" data-label="{{ account.name }}" data-kind="logo" data-logo="{{ account.logo or '' }}" {% if rule and rule.account_id|string == account.id|string %}selected{% endif %}>{{ account.name }}</option>
                {% endfor %}
            </select>
        </span>
    </label>
    <label>
        <span class="field-heading"><span>Merchant</span><a href="{{ url_for('merchants.new') }}">Add new</a></span>
        <span class="select-with-visual">
            <span class="select-leading" aria-hidden="true"></span>
            <select name="merchant_id" data-visual-select>
            <option value="" data-label="None" data-kind="none">None</option>
            {% for merchant in merchants %}
            <option value="{{ merchant.id }}" data-label="{{ merchant.name }}" data-kind="logo" data-logo="{{ merchant.logo or '' }}" {% if rule and rule.merchant_id|string == merchant.id|string %}selected{% endif %}>{{ merchant.name }}</option>
            {% endfor %}
            </select>
        </span>
    </label>
    <label>Visual
        <span class="select-with-visual">
            <span class="select-leading" aria-hidden="true"></span>
            <select name="visual_mode" data-visual-select>
                {% for value, label in [("auto", "Logo when available"), ("merchant_logo", "Merchant logo"), ("standard", "Standard income/expense")] %}
                <option value="{{ value }}" data-label="{{ label }}" data-kind="none" {% if rule and rule.visual_mode == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </span>
    </label>
    <label>Frequency
        <span class="select-with-visual">
            <span class="select-leading" aria-hidden="true"></span>
            <select name="frequency" data-visual-select>
                {% for frequency, symbol in [("daily", "D"), ("weekly", "W"), ("monthly", "M"), ("yearly", "Y")] %}
                <option value="{{ frequency }}" data-label="{{ frequency }}" data-kind="type" data-symbol="{{ symbol }}" data-tone="transfer" {% if rule and rule.frequency == frequency %}selected{% endif %}>{{ frequency }}</option>
                {% endfor %}
            </select>
        </span>
    </label>
    <label>Next Due Date
        <span class="date-control">
            <span class="date-icon" aria-hidden="true"></span>
            <input type="date" name="next_due_date" value="{{ rule.next_due_date if rule else '' }}" required>
        </span>
    </label>
    <label>
        <span class="field-heading"><span>Category</span><a href="{{ url_for('categories.new') }}">Add new</a></span>
        <span class="select-with-visual">
            <span class="select-leading" aria-hidden="true"></span>
            <select name="category" data-visual-select>
            <option value="" data-label="None" data-kind="none">None</option>
            {% for category in categories %}
            <option value="{{ category.name }}" data-label="{{ category.name }}" data-kind="color" data-color="{{ category.color }}" data-icon="{{ category.icon or category.name[0] }}" {% if rule and rule.category == category.name %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
            </select>
        </span>
    </label>
    <label>Description <input name="description" value="{{ rule.description if rule else '' }}"></label>
    {% if rule %}
    <label class="check"><input type="checkbox" name="is_active" {% if rule.is_active %}checked{% endif %}> Active</label>
    {% endif %}
    <button>Save</button>
</form>
{% endblock %}
