<nav class="workspace-tabs" aria-label="Plan views">{% for endpoint,label in [('plan.index','Overview'),('budgets.index','Budget'),('calendar.index','Calendar'),('recurring.index','Recurring'),('accounts.pots','Goals'),('forecast.index','Forecast')] %}<a href="{{ url_for(endpoint,month=request.args.get('month') or today_iso()[:7],days=request.args.get('days') or 30) }}" {% if request.endpoint==endpoint %}aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}</nav>
