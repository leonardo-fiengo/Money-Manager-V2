{% extends "base.html" %}
{% block content %}
<h1>{{ "Edit" if loan else "Add" }} Prestito</h1>
{% if error %}<p class="form-error">{{ error }}</p>{% endif %}
<form class="form" method="post">
    <label>Type
        <select name="direction" required>
            <option value="lent_out" {% if loan and loan.direction == "lent_out" %}selected{% endif %}>I lent money</option>
            <option value="borrowed" {% if loan and loan.direction == "borrowed" %}selected{% endif %}>Someone lent me money</option>
        </select>
    </label>
    <label>Person <input name="counterparty" value="{{ loan.counterparty if loan else '' }}" required></label>
    <label>Principal Amount <input type="number" step="0.01" min="0" name="principal_amount" value="{{ loan.principal_amount if loan else '' }}" required></label>
    <label>Expected Total Back <input type="number" step="0.01" min="0" name="expected_total_amount" value="{{ loan.expected_total_amount if loan else '' }}" required></label>
    <label>Start Date <input type="date" name="start_date" value="{{ loan.start_date if loan else '' }}" required></label>
    <label>Due Date <input type="date" name="due_date" value="{{ loan.due_date if loan else '' }}"></label>
    {% if loan %}
    <label>Status
        <select name="status">
            <option value="open" {% if loan.status == "open" %}selected{% endif %}>Open</option>
            <option value="closed" {% if loan.status == "closed" %}selected{% endif %}>Closed</option>
        </select>
    </label>
    {% endif %}
    <label>Notes <input name="notes" value="{{ loan.notes if loan else '' }}"></label>
    <button>Save</button>
</form>
{% endblock %}
