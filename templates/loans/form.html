{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">Between people</p><h1>{{ 'Edit' if loan else 'Add' }} {{ kind }}</h1></div></div>
<form method="post" class="form" data-loan-form>{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="kind" value="{{ kind }}"><label>Direction<select name="direction"><option value="borrowed" {{ 'selected' if loan and loan.direction=='borrowed' else '' }}>I owe someone</option><option value="lent_out" {{ 'selected' if loan and loan.direction=='lent_out' else '' }}>Someone owes me</option></select></label><label>Contact<select name="contact_id" data-loan-contact><option value="">Use a name instead</option>{% for contact in contacts %}<option value="{{ contact.id }}" {{ 'selected' if loan and loan.contact_id|string==contact.id|string else '' }}>{{ contact.name }}{{ ' (archived)' if not contact.is_active else '' }}</option>{% endfor %}</select><small class="field-help"><a href="{{ url_for('contacts.edit') }}">Add a contact</a> to use them for payments too.</small></label><label data-counterparty>Person or organization<input name="counterparty" maxlength="100" value="{{ loan.counterparty if loan else '' }}" placeholder="Who are we talking about?"></label><label>{{ 'Amount owed' if kind=='debt' else 'Principal amount' }}<input type="number" name="principal_amount" min="0.01" step="0.01" required value="{{ loan.principal_amount if loan else '' }}"></label><label>Total to repay<input type="number" name="expected_total_amount" min="0.01" step="0.01" value="{{ loan.expected_total_amount if loan else '' }}"><small class="field-help">Leave blank to use the original amount. Include interest here if agreed.</small></label><label>Start date<input type="date" name="start_date" required value="{{ loan.start_date if loan else today }}"></label><label>Due date<input type="date" name="due_date" value="{{ (loan.due_date or '') if loan else '' }}"></label><label>Notes<textarea name="notes" maxlength="2000">{{ (loan.notes or '') if loan else '' }}</textarea></label><div class="form-footer"><a class="quiet-button" href="{{ url_for('debts.index' if kind=='debt' else 'loans.index') }}">Cancel</a><button>Save {{ kind }}</button></div></form>{% endblock %}
