{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">Contacts</p><h1>{{ 'Edit contact' if editing else 'Add contact' }}</h1></div></div>
<form method="post" class="form">{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required maxlength="100" value="{{ contact.name if contact else '' }}" autocomplete="name"></label><label>Email<input type="email" name="email" maxlength="254" value="{{ contact.email if contact else '' }}" autocomplete="email"></label><label>Phone<input type="tel" name="phone" maxlength="50" value="{{ contact.phone if contact else '' }}" autocomplete="tel"></label><label>Notes<textarea name="notes" maxlength="2000">{{ contact.notes if contact else '' }}</textarea></label><div class="form-footer"><a class="quiet-button" href="{{ url_for('contacts.index') }}">Cancel</a><button>Save contact</button></div></form>{% endblock %}
