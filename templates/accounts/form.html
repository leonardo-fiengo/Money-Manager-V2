{% extends "base.html" %}
{% block content %}
<h1>{{ "Edit" if account else "Add" }} Account</h1>
<form class="form" method="post">
    <label>Name <input name="name" value="{{ account.name if account else '' }}" required></label>
    <label>Type
        <select name="type" required>
            {% for type in ["bank", "cash", "wallet", "credit_card", "investment"] %}
            <option value="{{ type }}" {% if account and account.type == type %}selected{% endif %}>{{ type }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Logo path <input name="logo" value="{{ account.logo if account else '' }}" placeholder="/static/uploads/accounts/cash.svg"></label>
    <label>Opening Balance <input type="number" step="0.01" name="opening_balance" value="{{ account.opening_balance if account else 0 }}"></label>
    <label>Settlement Account
        <select name="settlement_account_id">
            <option value="">None</option>
            {% for item in accounts %}
            <option value="{{ item.id }}" {% if account and account.settlement_account_id == item.id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Settlement Day <input type="number" min="1" max="28" name="settlement_day" value="{{ account.settlement_day if account else '' }}"></label>
    <label class="check"><input type="checkbox" name="is_active" checked> Active</label>
    <button>Save</button>
</form>
{% endblock %}
