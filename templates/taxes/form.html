{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">Tax tracker</p><h1>{{ 'Edit tax' if editing else 'Add tax' }}</h1></div></div>
<form method="post" class="form">{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" required maxlength="100" value="{{ tax.name if tax else '' }}" placeholder="IRPEF balance, IMU, or another tax"></label><label>Tax year<input type="number" name="tax_year" min="1900" max="2200" required value="{{ tax.tax_year if tax else year }}"><small class="field-help">The year this tax relates to, even if you pay it later.</small></label><label>Amount<input type="number" name="amount" step="0.01" min="0.01" required value="{{ tax.amount if tax else amount }}"></label><label>Due date<input type="date" name="due_date" required value="{{ tax.due_date if tax else '' }}"></label><label>Tax authority<input name="authority" maxlength="100" value="{{ tax.authority if tax else '' }}" placeholder="Agenzia delle Entrate, municipality…"></label><label>Notes<textarea name="notes" maxlength="2000">{{ tax.notes if tax else '' }}</textarea></label><div class="form-footer"><a class="quiet-button" href="{{ url_for('taxes.index',year=tax.tax_year if tax else year) }}">Cancel</a><button>Save tax</button></div></form>{% endblock %}
