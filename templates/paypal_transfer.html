{% extends "base.html" %}
{% block content %}
<div class="page-title">
    <h1>PayPal Transfer</h1>
</div>

<form class="form" method="post">
    <label>Amount
        <span class="amount-control">
            <select aria-label="Currency" disabled><option>&euro;</option></select>
            <input type="number" step="0.01" min="0" name="amount" value="{{ amount if amount else '' }}" placeholder="0.00" required>
        </span>
    </label>
    <label>Transfer Type
        <select name="mode">
            <option value="instant" {% if mode == "instant" %}selected{% endif %}>Flash transfer - 1.75%</option>
            <option value="normal" {% if mode == "normal" %}selected{% endif %}>Normal transfer - 0%</option>
        </select>
    </label>
    <button>Calculate</button>
</form>

<section class="grid metrics">
    <article class="card"><span>Fee</span><strong>&euro;{{ "%.2f"|format(fee) }}</strong></article>
    <article class="card"><span>You Receive</span><strong>&euro;{{ "%.2f"|format(net) }}</strong></article>
    <article class="card"><span>Fee Rate</span><strong>{{ "%.2f"|format(fee_rate) }}%</strong></article>
</section>
{% endblock %}
