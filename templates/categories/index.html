{% extends "base.html" %}
{% block content %}
<div class="page-title">
    <h1>Categories</h1>
    <a class="button" href="{{ url_for('categories.new') }}">Add Category</a>
</div>
<table>
    <tr><th></th><th>Name</th><th>Type</th><th></th></tr>
    {% for category in categories %}
    <tr>
        <td class="visual-cell">
            <span class="category-chip" style="--category-color: {{ category.color }}" data-icon="{{ category.icon or category.name[0] }}">{{ category.icon or category.name[0] }}</span>
        </td>
        <td>{{ category.name }}</td>
        <td>{{ category.type }}</td>
        <td><a class="action-link" href="{{ url_for('categories.edit', category_id=category.id) }}">Edit</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
