{% extends "base.html" %}
{% block content %}
<div class="page-title"><div class="title-copy"><p class="eyebrow">Make sense of spending</p><h1>{{ "Edit" if category else "Add" }} Category</h1></div></div>
{% if error %}<p class="form-error">{{ error }}</p>{% endif %}
<form class="form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name <input name="name" value="{{ category.name if category else '' }}" required></label>
    <label>Type
        <select name="type">
            {% for type in ["expense", "income", "investment", "transfer", "any"] %}
            <option value="{{ type }}" {% if category and category.type == type %}selected{% endif %}>{{ type }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Color <input type="color" name="color" value="{{ category.color if category else '#64748b' }}"></label>
    <label>Icon <input name="icon" value="{{ category.icon if category else '' }}"></label>
    {% if category %}
    <label class="check"><input type="checkbox" name="is_active" {% if category.is_active %}checked{% endif %}> Active</label>
    {% endif %}
    <button>Save</button>
</form>
{% endblock %}
